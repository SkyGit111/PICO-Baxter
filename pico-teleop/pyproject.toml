[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xrobotoolkit_teleop"
version = "1.0.3"
description = "XR teleoperation core with a RealMan hardware adapter"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Zhigen", email = "zhaozhigen@gmail.com"}
]
dependencies = [
    "numpy",
    "tyro",
]

[project.optional-dependencies]
dev = [
    "black",
]
camera = [
    "pyrealsense2",
    "av",
]

[tool.setuptools.packages.find]
include = ["xrobotoolkit_teleop*"]

[tool.black]
line-length = 120
